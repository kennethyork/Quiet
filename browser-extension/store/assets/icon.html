<!doctype html>
<html lang="en" data-size="128x128">
  <head>
    <meta charset="utf-8" />
    <title>store icon</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <!-- The store icon is opaque on purpose: Chrome asks for an icon with no transparency, and a
       solid background in the app's own colour makes it read as a launcher icon rather than a
       floating shield. -->
  <body style="padding: 0; background: #0b1220">
    <div class="icon">
      <img src="icon-256.png" alt="" />
    </div>
  </body>
</html>
