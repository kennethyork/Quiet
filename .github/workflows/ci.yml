name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: proves the project is coherent before anything expensive runs.
  verify:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Bundle JavaScript
        run: npx expo export -p android --output-dir /tmp/export

      - name: Generate the native project
        run: npx expo prebuild -p android

      - name: Unit tests
        run: cd android && ./gradlew :quiet-vpn:testDebugUnitTest

      # The site is hand-written, so it is checked against the repository it describes: links,
      # download names, and the numbers it claims.
      - name: Website checks
        run: node website/check.mjs

  # Builds the browser extension for every browser and attaches the packages to the run, so a
  # testable build needs nothing but a push - the same deal the APK job offers.
  extension:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.collect.outputs.version }}
      label: ${{ steps.collect.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No `npm install`: the extension is deliberately dependency-free.
      - name: Unit tests
        run: cd browser-extension && npm test

      - name: Build every target
        run: cd browser-extension && npm run build

      # Loads the build in whatever browser the runner has. It reports itself skipped when that
      # browser cannot run unpacked extensions, rather than failing the build for the wrong reason.
      - name: Smoke test
        run: cd browser-extension && npm run smoke

      - name: Collect the packages
        id: collect
        run: |
          version=$(node -p "require('./app.json').expo.version")
          label=$(node -p "require('./app.json').expo.name")
          mkdir -p dist
          cp browser-extension/dist/*.zip browser-extension/dist/*.xpi dist/
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload the extension packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.label }}-${{ steps.collect.outputs.version }}-browser-extension
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  # Signs and publishes to the browser stores, on tags only. Every store's credentials are
  # optional: a store whose secrets are absent is skipped with a note, and the job still passes,
  # because a repository that has not set up a Microsoft account yet is not a broken repository.
  # Signing is what turns the Firefox package from a temporary add-on into a permanent install.
  store:
    needs: [verify, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the packages to publish
        run: cd browser-extension && npm run build

      - name: Publish to the stores that have credentials
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: cd browser-extension && npm run store:publish

      - name: Upload the signed Firefox package
        if: hashFiles('browser-extension/dist/*-signed.xpi') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.ref_name }}-firefox-signed
          path: browser-extension/dist/*-signed.xpi
          if-no-files-found: ignore
          retention-days: 90

  # Builds the APK you install on a phone, and publishes it as a workflow artifact.
  apk:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.collect.outputs.version }}
      label: ${{ steps.collect.outputs.label }}
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # Only used when the two secrets are configured. Without them the generated project keeps
      # Expo's default of signing release builds with the debug key, which still installs fine on a
      # phone - it just means a later, properly signed build cannot update over it.
      - name: Restore the release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PROPERTIES" ]; then
            echo "signing=debug key (no ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PROPERTIES secrets)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p credentials
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > credentials/quiet-release.jks
          printf '%s\n' "$KEYSTORE_PROPERTIES" > credentials/keystore.properties
          echo "signing=release keystore" >> "$GITHUB_OUTPUT"

      - name: Generate the native project
        run: npx expo prebuild -p android

      - name: Build the release APK
        env:
          NODE_ENV: production
        run: cd android && ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect the APK
        id: collect
        run: |
          version=$(node -p "require('./app.json').expo.version")
          # The file name follows the app's own label: what you see in your downloads should match
          # what you see in your launcher, not the name of the repository.
          label=$(node -p "require('./app.json').expo.name")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${label}-${version}.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.label }}-${{ steps.collect.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "### ${{ steps.collect.outputs.label }} ${{ steps.collect.outputs.version }} APK"
            echo ""
            echo "Download it from the **Artifacts** section at the bottom of this run page."
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| File | \`${{ steps.collect.outputs.label }}-${{ steps.collect.outputs.version }}.apk\` |"
            echo "| Package | \`dev.quiet.app\` |"
            echo "| Architectures | arm64-v8a, armeabi-v7a (every real phone) |"
            echo "| Signed with | ${{ steps.keystore.outputs.signing }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "Install it on the phone, tap the shield, grant the VPN permission and set a PIN."
            echo "If Android refuses to install over an existing copy, uninstall that copy first: the signatures differ."
          } >> "$GITHUB_STEP_SUMMARY"

  # Pushing a tag like v1.0.0 builds the APK above and publishes it as a release. The store job is
  # in `needs` only so a signed Firefox package can be attached when signing worked; `always()`
  # keeps a failed store upload from holding back the release itself.
  release:
    needs: [apk, extension, store]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apk.outputs.label }}-${{ needs.apk.outputs.version }}
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.extension.outputs.label }}-${{ needs.extension.outputs.version }}-browser-extension
          path: dist

      # Only present when the Firefox credentials were set and signing succeeded.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ github.event.repository.name }}-${{ github.ref_name }}-firefox-signed
          path: dist

      # A signed XPI installs for good; an unsigned one is forgotten when Firefox restarts. When
      # signing ran, its file takes the canonical name so the download button, the site and the
      # release all hand out the one that stays installed.
      - name: Prefer the signed Firefox package
        run: |
          cd dist
          signed=$(ls *-signed.xpi 2>/dev/null | head -1 || true)
          if [ -n "$signed" ]; then
            mv -f "$signed" "${signed%-signed.xpi}.xpi"
          fi
          ls -lh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > NOTES.md <<'NOTES'
          ### Install

          The app is called **Quiet** in the launcher, in notifications and under Settings > Apps. Its
          package name is still `dev.quiet.app`, which is what Android and the device owner command
          refer to.

          Copy the APK to an Android phone (Android 7 or newer) and open it. Tap the shield, allow the
          VPN connection Android offers you, and set your PIN when asked.

          ### Signing

          This build is signed with Android's **debug key** unless the repository has been given
          `ANDROID_KEYSTORE_BASE64` and `ANDROID_KEYSTORE_PROPERTIES` secrets. That is fine for testing
          and nothing more: an app signed with the debug key can never be updated by a properly signed
          build, so a later real signing key means uninstalling and reinstalling.

          ### What it does

          Filtering happens on the device. A local VPN service pulls only DNS traffic out of the
          system, checks every lookup against your blocklists, answers blocked names locally and relays
          the rest to a family-safe resolver. No account, no server, no telemetry.

          `docs/ARCHITECTURE.md` has the detail, and `docs/UNINSTALL-PROTECTION.md` explains what
          Android does and does not allow an app to protect itself from.

          ### Website

          One page for both halves, with the download buttons:
          <https://kennethyork.github.io/Quiet/>

          ### Browser extension

          The same blocklists for Chrome, Edge, Brave, Opera, Vivaldi, Firefox and Safari. Install
          `quiet-chromium-<version>.zip` from `chrome://extensions` (Developer mode, then Load
          unpacked after unzipping), or `quiet-firefox-<version>.xpi` from
          `about:debugging#/runtime/this-firefox`. Safari needs Xcode: see
          `browser-extension/README.md`.
          NOTES
          gh release create "${GITHUB_REF_NAME}" dist/*.apk dist/*.zip dist/*.xpi \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${{ needs.apk.outputs.label }} ${GITHUB_REF_NAME#v}" \
            --notes-file NOTES.md
